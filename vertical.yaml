# Brand/domain config for the "pawcontact" vertical (scaffolded by
# scripts/scaffold_vertical.py, Fase 4.1; renamed from "patitas" on 2026-07-16
# once Vero picked the real brand and bought the domain). Schema and semantics:
# engine/generator/vertical_config.py.
id: pawcontact
brand_name: "PawContact"
domain: "https://www.pawcontact.com"

# Which of the engine's closed brand styles this vertical may use. Each name
# must have a matching engine/generator/styles/<name>.css. Edit this list to
# taste; run `python scripts/scaffold_vertical.py --list-styles` to see all.
styles:
  catalog:
    - sunny-paws
    - aqua-clean
    - sage-calm
    - warm-sand
    - black-gold
    - soft-blush
    - charcoal-clean
    - electric-slate
    - terracotta-warm
    - midnight-ink
    - clarity-editorial
    - horizon-teal

# Per-language UI string overrides layered on the engine base STRINGS
# (engine/generator/strings_base.py). Empty by default. If you override ANY
# key you must declare BOTH languages (even as {}) so ES/EN parity can't
# break silently (house rule). Example:
#   strings_overrides:
#     es:
#       btn_booking: "Agendar cita"
#     en: {}
strings_overrides:
  es: {}
  en: {}

# Conditional-block overrides layered on the engine registry
# (engine/generator/blocks.py, ENGINE_BLOCKS). Each block gates on the
# payload's `business_type` via `enabled_for`:
#   - list of business types -> renders only for those types (payloads with
#     no business_type, or "general", always keep the block)
#   - "all"  -> renders for every business type
#   - "none" -> this vertical never renders the block
# Empty {} = use the engine defaults (delivery_pickup: food/retail;
# portfolio: creative/beauty/wellness/professional/fitness; lookbook: all).
# Tune per this vertical's giro, e.g.:
#   blocks:
#     delivery_pickup:
#       enabled_for: none
#
# portfolio -> "none" (DECISION DE VERO 2026-07-26). El bloque no pinta
# fotos: es UN LINK MAS en la fila de enlaces secundarios, donde ya compiten
# Instagram, Facebook, TikTok, mapas y resenas. Y su propio placeholder pedia
# "tu Instagram, un album de Google Fotos, tu sitio" — o sea, un enlace a lo
# que YA se pregunta. Para un negocio chico sin web, su portafolio ES su
# Instagram. Cada enlace de mas diluye a los que convierten (WhatsApp, llamar,
# como llegar), y quien quiere ensenar su trabajo lo hace con la GALERIA de
# fotos, que se ve sin salir de la pagina. Se apaga aqui, no se borra del
# motor: el codigo sirve si nace una vertical donde un portafolio externo si
# tenga sentido (un fotografo con Behance).
# delivery_pickup stays on defaults: boutiques classify as "retail" cleanly,
# already covered by food/retail.
blocks:
  portfolio:
    enabled_for: none
  # ACTIVACION del vCard (linkFactory/22). Ver la nota larga en
  # verticals/hmu/vertical.yaml: misma razon, mismo alcance.
  vcard:
    enabled_for: all
  # ACTIVACION del pase de Google Wallet (linkFactory/18). Ver la nota larga en
  # el vertical.yaml de HMU Link: misma razon, mismo alcance.
  wallet_google:
    enabled_for: all

# Como se LEE el intake de esta vertical (ver INTAKE_DEFAULTS en
# vertical_config.py). El worker extrae estos campos como texto —solo porque el
# tally-field-aliases.json de al lado los declara— y aqui se dice en que se
# convierten. Una vertical que no abre esta seccion no gana ni una clave.
intake:
  fields:
    # DICTAMEN pawcontact/6 (2026-07-27). El consentimiento de derechos de
    # imagen se contesta en el intake y hasta hoy vivia SOLO en el blob crudo
    # que guarda el worker, con expirationTtl de 90 dias — mientras que la
    # pagina con esas fotos es PERMANENTE. La unica prueba de un consentimiento
    # no puede expirar antes que el uso que ampara, asi que el campo tiene que
    # quedar en el client.json, que si es permanente.
    #
    # Van las DOS declaraciones o no sirve ninguna: el alias de al lado hace que
    # el WORKER lo extraiga al payload, y esta linea hace que
    # build_client_from_intake lo ESCRIBA al client.json. Con solo la primera,
    # el campo llega al payload y se tira ahi mismo.
    #
    # NO se declara `schema.require_true` (ModaLink si lo hace). Ahi la casilla
    # es un gate: sin ella el generador se niega a publicar. Prenderlo aqui
    # dejaria de generar las paginas de los clientes que YA compraron, porque
    # sus client.json son anteriores al campo y no lo traen. Es una decision de
    # producto de Vero, no del re-export; queda fichada.
    photo_rights_confirmed: {kind: yes_no}

# Datos legales de la vertical (Ola 1b). Los consumen las plantillas de
# engine/store/legal/*.md (Terminos y Aviso de Privacidad, ES/EN) y el
# generador, que inserta `disclaimers` en el pie de las paginas de cliente
# para que no puedan removerse a mano. Schema y defaults:
# engine/generator/vertical_config.py -> LEGAL_DEFAULTS.
#
# Lo que NO declares usa el default de la casa: refund_days 7 (politica unica
# decidida por Vero el 2026-07-20: 7 dias naturales desde la publicacion +
# retiro inmediato de la pagina), support_email hello@<dominio>, cfdi a
# solicitud, jurisdiccion Estados Unidos Mexicanos.
legal:
  responsable: "Verónica Pérez Arroyo"
  domicilio_fiscal: "Virgen 5552, Arboledas, Zapopan, Jalisco, C.P. 45070, México"
  updated:
    es: "20 de julio de 2026"
    en: "July 20, 2026"
  # Avisos bilingues que el generador imprime en el pie de cada pagina de
  # cliente y en los Terminos (hallazgo #14 de la auditoria). Recuperado en la
  # Ola 2 (2026-07-20, decision de Vero): los Terminos hechos a mano de
  # PawContact responsabilizaban al negocio de las reglas profesionales de su
  # giro y la plantilla estandar no lo traia. Esta redactado hacia AFUERA
  # porque quien lee el pie de la pagina publica es el dueno de la mascota, no
  # el anunciante.
  disclaimers:
    - es: "Información publicada por el negocio anunciante. Los servicios veterinarios y otros servicios regulados son su responsabilidad profesional; PawContact no verifica credenciales ni licencias."
      en: "Information published by the advertising business. Veterinary and other regulated services are its professional responsibility; PawContact does not verify credentials or licenses."
