<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PawContact — 12 estilos</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f0e6;color:#3d2b1f;font:15px/1.4 system-ui,sans-serif}
    main{width:min(1500px,calc(100% - 40px));margin:28px auto 36px}
    h1{margin:0 0 6px;font:700 32px Georgia,serif}
    p{margin:0 0 22px;color:#6f6155}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
    figure{min-width:0;margin:0;padding:10px;background:#fffdf8;border:1px solid #e3daca;border-radius:14px;box-shadow:0 8px 24px #4a2e1712}
    img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;object-position:top;border-radius:8px;border:1px solid #e3daca}
    figcaption{padding:9px 3px 2px;font-weight:700}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>Los 12 estilos de PawContact</h1>
  <p>Mismo negocio, mismo contenido y mismo encuadre; solo cambia el estilo del motor.</p>
  <div class="grid">
    <figure><img src="sunny-paws.jpg" alt=""><figcaption>sunny-paws</figcaption></figure>
    <figure><img src="aqua-clean.jpg" alt=""><figcaption>aqua-clean</figcaption></figure>
    <figure><img src="sage-calm.jpg" alt=""><figcaption>sage-calm</figcaption></figure>
    <figure><img src="warm-sand.jpg" alt=""><figcaption>warm-sand</figcaption></figure>
    <figure><img src="black-gold.jpg" alt=""><figcaption>black-gold</figcaption></figure>
    <figure><img src="soft-blush.jpg" alt=""><figcaption>soft-blush</figcaption></figure>
    <figure><img src="charcoal-clean.jpg" alt=""><figcaption>charcoal-clean</figcaption></figure>
    <figure><img src="electric-slate.jpg" alt=""><figcaption>electric-slate</figcaption></figure>
    <figure><img src="terracotta-warm.jpg" alt=""><figcaption>terracotta-warm</figcaption></figure>
    <figure><img src="midnight-ink.jpg" alt=""><figcaption>midnight-ink</figcaption></figure>
    <figure><img src="clarity-editorial.jpg" alt=""><figcaption>clarity-editorial</figcaption></figure>
    <figure><img src="horizon-teal.jpg" alt=""><figcaption>horizon-teal</figcaption></figure>
  </div>
</main>
</body>
</html>
