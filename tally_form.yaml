# Real intake spec for the "pawcontact" vertical (Fase 5.3, Etapa B2).
# Every title below was verified PROGRAMMATICALLY (not by eye) against
# engine/worker/tally-field-aliases.json before being written here: computed
# normalizeKey(title) and confirmed it is literally present in that field's
# alias array. `python scripts/create_tally_forms.py pawcontact --check-mapping`
# must report every REQUIRED question as [OK] before this form goes live in
# Tally — re-run it after any wording change.
#
# default_language is intentionally NOT asked here: engine/worker/worker.js
# derives it from which form (ES/EN) was submitted when unanswered (see
# DATA_CONTRACT.md § Contrato A), which is documented, legitimate behavior —
# not a workaround, and it's simpler than adding a question. Note this is now
# a choice, not a limitation: as of Fase 2.5, the explicit language-question
# alias is derived from BRAND_NAME at runtime
# (engine/worker/product-config.mjs::languageQuestionAliases), so "Which
# language should your PawContact show first?" WOULD match automatically if
# this vertical ever wants to ask it explicitly — no engine/JSON edit needed.

form_title:
  es: "PawContact — Cuestionario de tu negocio"
  en: "PawContact — Your business questionnaire"

# Modificación prellenada: 21 preguntas visibles toman su valor inicial de un
# hidden field del mismo nombre. Son las 21 del cableado vivo anterior,
# sustituyendo portfolio_link (pregunta retirada) por brand_style.
prefill_fields:
  - business_name
  - brand_style
  - short_description
  - whatsapp
  - phone
  - public_email
  - website
  - booking_url
  - instagram
  - facebook
  - tiktok
  - services_text
  - featured_text
  - policies_text
  - faq_text
  - opening_hours_text
  - address
  - google_maps_url
  - google_reviews_url
  - delivery_pickup_links_text
  - pet_notes_text

# Cada pregunta declara `name:`: el field name ESTABLE con el que Tally guarda
# esa respuesta. Es deliberadamente el MISMO en el formulario ES y en el EN, y
# coincide con el campo del public_payload del worker (ver
# engine/worker/tally-field-aliases.json) cuando la pregunta mapea a uno. Eso es
# lo que permite prellenar el formulario cuando el cliente pide una MODIFICACION
# (Ola 1c): se arma la URL con estos nombres. Antes el field name se derivaba del
# titulo (nk(titulo)), asi que divergia entre idiomas y se movia con cualquier
# cambio de wording — prellenar era imposible.
questions:
  # --- Identidad del negocio ---
  - id: business_name
    type: text
    name: business_name
    required: true
    title: {es: "Nombre del negocio", en: "Business name"}

  - id: brand_style
    type: multiple_choice
    name: brand_style
    required: true
    title: {es: "Elige tu estilo", en: "Pick your style"}
    options:
      - es: "sunny-paws — alegre y jugueton (estilistas/grooming)"
        en: "sunny-paws — playful and bright (groomers)"
        image_url: "https://www.hmulink.com/assets/previews/sunny-paws.jpg"
      - es: "aqua-clean — limpio y fresco (veterinarias)"
        en: "aqua-clean — fresh and clean (vet clinics)"
        image_url: "https://www.hmulink.com/assets/previews/aqua-clean.jpg"
      - es: "sage-calm — natural y relajante (hoteles/guarderias)"
        en: "sage-calm — natural and calm (boarding/daycare)"
        image_url: "https://www.hmulink.com/assets/previews/sage-calm.jpg"
      - es: "warm-sand — calido y cercano (boutiques)"
        en: "warm-sand — warm and artisanal (boutiques)"
        image_url: "https://www.hmulink.com/assets/previews/warm-sand.jpg"
      - es: "black-gold — elegante y premium (boutiques)"
        en: "black-gold — elegant and premium (boutiques)"
        image_url: "https://www.hmulink.com/assets/previews/black-gold.jpg"
      - es: "soft-blush — suave y cariñoso (spa/estética)"
        en: "soft-blush — soft and caring (spa/grooming)"
        image_url: "https://www.hmulink.com/assets/previews/soft-blush.jpg"
      - es: "charcoal-clean — moderno y profesional (veterinarias/entrenamiento)"
        en: "charcoal-clean — modern and professional (vet clinics/training)"
        image_url: "https://www.hmulink.com/assets/previews/charcoal-clean.jpg"
      - es: "electric-slate — audaz y dinámico (entrenamiento/guardería)"
        en: "electric-slate — bold and dynamic (training/daycare)"
        image_url: "https://www.hmulink.com/assets/previews/electric-slate.jpg"
      - es: "terracotta-warm — artesanal y acogedor (boutiques/hospedaje)"
        en: "terracotta-warm — artisanal and welcoming (boutiques/boarding)"
        image_url: "https://www.hmulink.com/assets/previews/terracotta-warm.jpg"
      - es: "midnight-ink — sobrio y distinguido (servicios premium)"
        en: "midnight-ink — refined and distinguished (premium services)"
        image_url: "https://www.hmulink.com/assets/previews/midnight-ink.jpg"
      - es: "clarity-editorial — claro y ordenado (negocios con muchos servicios)"
        en: "clarity-editorial — clear and organized (multi-service businesses)"
        image_url: "https://www.hmulink.com/assets/previews/clarity-editorial.jpg"
      - es: "horizon-teal — fresco y confiable (hospedaje/veterinarias)"
        en: "horizon-teal — fresh and trustworthy (boarding/vet clinics)"
        image_url: "https://www.hmulink.com/assets/previews/horizon-teal.jpg"

  # business_type is optional and only gates two COSMETIC blocks (portfolio,
  # delivery/pickup links) — never required data. Answers are keyword-scored
  # by build_client_from_intake.py::normalize_business_type (forgiving of
  # ES/EN and free text), not matched verbatim. The 5 option pairs below were
  # simulated against that exact scorer (not guessed) so EN and ES map to the
  # SAME closed category: grooming/vet -> "pets", training -> "fitness",
  # boarding -> "general" (no gate, always renders), boutique -> "retail"
  # (unlocks delivery/pickup — matches the boutique-bigotes demo's Rappi
  # link). Because "pets" itself gates nothing by default, this vertical's
  # own vertical.yaml widens `portfolio.enabled_for` to "all" so groomers and
  # vets can still show a before/after or facility gallery.
  - id: business_type
    type: dropdown
    name: business_type
    title: {es: "¿Qué tipo de negocio es?", en: "What type of business is it?"}
    options:
      - {es: "Estética canina para mascotas", en: "Pet grooming"}
      - {es: "Veterinaria", en: "Pet clinic / veterinary care"}
      - {es: "Hospedaje / guardería", en: "Boarding / daycare"}
      - {es: "Entrenamiento canino", en: "Dog training"}
      - {es: "Tienda / boutique de productos", en: "Pet products / boutique"}

  - id: short_description
    type: textarea
    name: short_description
    required: true
    title: {es: "Describe tu negocio en 1-2 frases", en: "Describe your business in 1-2 sentences"}

  # --- Contacto (WhatsApp cubre el minimo de contacto que exige el Worker) ---
  - id: whatsapp
    type: phone
    name: whatsapp
    required: true
    title: {es: "WhatsApp público para tus clientes", en: "Public WhatsApp number for clients"}

  - id: phone
    type: phone
    name: phone
    title: {es: "Teléfono público para llamadas", en: "Public phone number for calls"}

  - id: public_email
    type: email
    name: public_email
    title: {es: "Correo público", en: "Public email"}

  - id: website
    type: link
    name: website
    title: {es: "Sitio web", en: "Website"}

  - id: booking_url
    type: link
    name: booking_url
    title: {es: "Enlace externo de reservas", en: "External booking link"}

  # Las tres redes son `text` y NO `link` a proposito (hallazgo de Vero,
  # 2026-07-26, llenando el formulario con un negocio real). `link` monta el
  # INPUT_LINK de Tally, que EXIGE una URL y rechaza "@puppy_patch_pv" — y el
  # usuario es justo lo que la gente sabe de memoria y comparte. El generador
  # ya aceptaba el handle desde siempre (build_client_from_intake.social_url
  # convierte @usuario -> https://instagram.com/usuario, tambien "usuario" a
  # secas y "instagram.com/usuario"); el unico que lo rechazaba era el
  # formulario. Bajar la validacion no pierde nada: lo que llegue mal formado
  # ya se descartaba despues.
  - id: instagram
    type: text
    name: instagram
    title: {es: "Instagram", en: "Instagram"}
    placeholder:
      es: "@tu_usuario o el enlace completo"
      en: "@your_handle or the full link"

  - id: facebook
    type: text
    name: facebook
    title: {es: "Facebook", en: "Facebook"}
    placeholder:
      es: "@tu_pagina o el enlace completo"
      en: "@your_page or the full link"

  - id: tiktok
    type: text
    name: tiktok
    title: {es: "TikTok", en: "TikTok"}
    placeholder:
      es: "@tu_usuario o el enlace completo"
      en: "@your_handle or the full link"

  - id: primary_cta
    type: dropdown
    name: primary_cta
    title: {es: "¿Qué botón quieres destacar?", en: "Which button should be featured?"}
    options:
      - {es: "WhatsApp", en: "WhatsApp"}
      - {es: "Llamada telefónica", en: "Phone call"}
      - {es: "Reservas / agenda", en: "Booking link"}
      - {es: "Sitio web", en: "Website"}
      - {es: "Instagram", en: "Instagram"}

  # --- Servicios y precios ---
  - id: services_text
    type: textarea
    name: services_text
    required: true
    title: {es: "Lista tus servicios con precios", en: "List your services with prices"}
    placeholder:
      es: "Un servicio por línea. Ej: Baño y corte — desde $350 MXN"
      en: "One service per line. E.g.: Full groom — from $45"

  - id: featured_text
    type: textarea
    name: featured_text
    title:
      es: "Paquete destacado, promoción u oferta especial"
      en: "Featured package, promo, or signature offer"

  - id: policies_text
    type: textarea
    name: policies_text
    title: {es: "Políticas que tus clientes deben ver", en: "Policies your clients should see"}

  - id: faq_text
    type: textarea
    name: faq_text
    title: {es: "Preguntas frecuentes", en: "Frequently asked questions"}

  # --- Horarios y ubicación ---
  - id: opening_hours_text
    type: textarea
    name: opening_hours_text
    required: true
    title: {es: "¿Cuáles son tus horarios de atención?", en: "What are your business hours?"}

  - id: address
    type: text
    name: address
    title: {es: "Ubicación 1 dirección pública", en: "Location 1 public address"}

  - id: google_maps_url
    type: link
    name: google_maps_url
    title: {es: "Ubicación 1 enlace de Google Maps", en: "Location 1 Google Maps link"}

  - id: google_reviews_url
    type: link
    name: google_reviews_url
    title: {es: "Enlace de Google Reviews", en: "Google Reviews link"}

  - id: delivery_pickup_links_text
    type: textarea
    name: delivery_pickup_links_text
    title: {es: "Links de delivery / pickup", en: "Delivery / pickup links"}
    placeholder:
      es: "Solo si aplica (boutiques). Ej: Rappi — https://rappi.com/tu-tienda"
      en: "Only if it applies (boutiques). E.g.: Rappi — https://rappi.com/your-store"

  # El titulo dice QUE poner, no como se llama el campo (hallazgo de Vero,
  # 2026-07-26: "Enlace de portafolio" no dice nada). El placeholder ya
  # existia y no bastó: en un INPUT_LINK compite con la pista de URL del
  # propio Tally y se lee como ejemplo, no como instruccion. Los titulos
  # nuevos estan dados de alta en tally-field-aliases.json, asi que el worker
  # sigue reconociendo la respuesta por titulo ademas de por `name`.
  # --- Fotos ---
  #
  # Las tres preguntas dicen la FORMA y los LIMITES porque el recorte y el
  # descarte son SILENCIOSOS (medido el 2026-07-26, no supuesto):
  #   - el logo se pinta en un circulo de 46 px con object-fit:cover
  #     (templates/base.html, `.monogram`), asi que un logotipo alargado
  #     pierde los lados;
  #   - la foto principal y las de la galeria van todas en `.figure img`, con
  #     aspect-ratio 4/3 y cover: una foto vertical se recorta arriba y abajo;
  #   - build_client_from_intake.download_image SOLO conserva jpeg/png/webp de
  #     menos de 8 MB y, si no, la pagina sale con el marcador de posicion sin
  #     avisarle a nadie. Un cliente que sube un HEIC de su iPhone caia justo
  #     ahi.
  - id: logo_url
    type: file
    name: logo_url
    title:
      es: "Sube tu logo — cuadrado (se recorta en círculo). JPG, PNG o WebP, máx 8 MB"
      en: "Upload your logo — square (it gets cropped into a circle). JPG, PNG or WebP, max 8 MB"

  - id: image_url
    type: file
    name: image_url
    title:
      es: "Sube una foto principal — horizontal (se recorta a 4:3). JPG, PNG o WebP, máx 8 MB"
      en: "Upload a main photo — landscape (cropped to 4:3). JPG, PNG or WebP, max 8 MB"

  - id: gallery_image_urls
    type: file
    name: gallery_image_urls
    multiple: true
    max_files: 5
    title:
      es: "Más fotos (hasta 5) — horizontales (se recortan a 4:3). JPG, PNG o WebP, máx 8 MB cada una"
      en: "More photos (up to 5) — landscape (cropped to 4:3). JPG, PNG or WebP, max 8 MB each"

  # pet_notes_text maps via the Worker's fallback-by-token rule (contains
  # "pet"/"mascota" anywhere in the normalized title), not an exact alias —
  # confirmed in engine/worker/worker.js. Deliberately not phrased to match
  # the primary alias verbatim; the token rule is intentionally forgiving.
  - id: pet_notes_text
    type: textarea
    name: pet_notes_text
    title:
      es: "¿Algo que debamos saber antes de traer a tu mascota?"
      en: "Anything pet parents should know before their visit?"
    placeholder:
      es: "Ej: Trae cartilla de vacunación. Perros con correa, gatos en transportadora."
      en: "E.g.: Bring vaccination records. Dogs on leash, cats in carriers."

  # --- Legal (confirmacion interna: SI se guarda, pero NO se imprime) ---
  # Desde linkFactory/16 (2026-07-27) esta casilla SI mapea: el
  # tally-field-aliases.json de la vertical la declara y el `intake.fields` de
  # su vertical.yaml la escribe al client.json. Antes solo vivia en el blob
  # crudo del intake, que caduca a los 90 dias mientras la pagina con las fotos
  # es permanente (dictamen pawcontact/6). Sigue sin salir en la pagina: es una
  # declaracion de cumplimiento, no un dato del negocio.
  - id: photo_rights
    type: checkboxes
    name: photo_rights_confirmed
    required: true
    title:
      es: "Confirmo que las fotos que subo son mías o tengo derecho de usarlas"
      en: "I confirm the photos I upload are mine or I have the right to use them"
    options:
      - {es: "Sí", en: "Yes"}
